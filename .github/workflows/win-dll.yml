name: win-dll

# Windows engine path end to end:
#   1. build version-locked unicorn DLLs from the unicorn dev branch with
#      -DWIN32_ENABLE_VEH=OFF (PR #2364: VEH compiled out, preallocation
#      mandatory) for amd64 AND arm64;
#   2. auto-commit them into assets/windows/<arch>/ so consumers clone and
#      run (commit message carries [skip ci] to prevent a trigger loop);
#   3. THE REAL PRIZE — run golem's full engine test suite on Windows
#      runners against those DLLs: uc_open → UC_CTL_UC_PREALLOC → map →
#      hooks (incl. callbacks re-entering the backend) → emu_start. This
#      is the standing proof that the VEH/Go-runtime conflict is resolved
#      (ARCHITECTURE.md).

on:
  workflow_dispatch:
  push:
    branches: [dev-win]

env:
  # Source = OUR fork's golem/win-veh-off branch: unicorn 938efd1 (dev) +
  # PR #2286 (Windows ARM64 support, musl setjmp/longjmp). The branch is
  # the version lock — bump it only by re-running the golem suite.
  UNICORN_REPO: https://github.com/isesword/unicorn.git
  UNICORN_REF: golem/win-veh-off

jobs:
  build-unicorn-dll:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,      arch: amd64, cmake_arch: x64 }
          - { os: windows-2022,      arch: arm64, cmake_arch: ARM64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache unicorn source
        id: cache
        uses: actions/cache@v4
        with:
          path: unicorn-src
          key: unicorn-src-${{ env.UNICORN_REF }}

      - name: Checkout golem/win-veh-off
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -b ${{ env.UNICORN_REF }} ${{ env.UNICORN_REPO }} unicorn-src

      - name: Configure (VEH compiled out)
        run: |
          # VS generator cross builds: CMAKE_SYSTEM_PROCESSOR reports the BUILD
          # machine (AMD64), which makes unicorn's arch detection pick the x64
          # MASM path on the arm64 job. Setting the processor at configure time
          # targets the generator at the right arch and fixes the detection.
          cmake -S unicorn-src -B build `
            -A ${{ matrix.cmake_arch }} `
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }} `
            -DWIN32_ENABLE_VEH=OFF `
            -DUNICORN_ARCH="arm64;aarch64" `
            -DCMAKE_BUILD_TYPE=Release
      - name: Build unicorn.dll
        run: cmake --build build --config Release --parallel

      - name: Build provenance
        run: |
          $prov = @(
            "unicorn commit : ${{ env.UNICORN_REF }}",
            "target arch    : ${{ matrix.arch }}",
            "cmake          : -A ${{ matrix.cmake_arch }} -DWIN32_ENABLE_VEH=OFF -DUNICORN_ARCH=arm64;aarch64 -DCMAKE_BUILD_TYPE=Release",
            "built           : $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')"
          )
          $prov | Out-File -Encoding ascii PROVENANCE-${{ matrix.arch }}.txt
          cat PROVENANCE-${{ matrix.arch }}.txt

      - name: Locate + stage
        id: locate
        run: |
          $dll = Get-ChildItem -Recurse -Filter unicorn.dll | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "stage/${{ matrix.arch }}" | Out-Null
          Copy-Item $dll.FullName "stage/${{ matrix.arch }}/unicorn.dll"
          Copy-Item "PROVENANCE-${{ matrix.arch }}.txt" "stage/"
          echo "dll=stage/${{ matrix.arch }}/unicorn.dll" >> $env:GITHUB_OUTPUT

      - name: Smoke — the DLL must export uc_open and uc_ctl
        run: |
          $dll = "${{ steps.locate.outputs.dll }}"
          # Parse the PE export table with .NET — no dumpbin (MSVC optional
          # component, not on the runner PATH) needed.
          $bytes = [IO.File]::ReadAllBytes($dll)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $optOff = $peOff + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optOff)
          if ($magic -eq 0x20B) { $dataDirOff = $optOff + 112 } else { $dataDirOff = $optOff + 96 }
          $expRva = [BitConverter]::ToUInt32($bytes, $dataDirOff)
          if ($expRva -eq 0) { throw "DLL has no export table" }
          $numSec = [BitConverter]::ToUInt16($bytes, $peOff + 6)
          $secOff = $optOff + [BitConverter]::ToUInt16($bytes, $peOff + 20)
          function RvaToOff($rva) {
            for ($i = 0; $i -lt $numSec; $i++) {
              $s = $secOff + $i * 40
              $va = [BitConverter]::ToUInt32($bytes, $s + 12)
              $sz = [BitConverter]::ToUInt32($bytes, $s + 8)
              $raw = [BitConverter]::ToUInt32($bytes, $s + 20)
              if ($rva -ge $va -and $rva -lt $va + $sz) { return $raw + ($rva - $va) }
            }
            throw "RVA $rva not in any section"
          }
          $namesRva = [BitConverter]::ToUInt32($bytes, (RvaToOff $expRva) + 32)
          $namesCnt = [BitConverter]::ToUInt32($bytes, (RvaToOff $expRva) + 24)
          $names = @()
          for ($i = 0; $i -lt $namesCnt; $i++) {
            $p = RvaToOff ([BitConverter]::ToUInt32($bytes, (RvaToOff $namesRva) + $i * 4))
            $end = $p; while ($bytes[$end] -ne 0) { $end++ }
            $names += [Text.Encoding]::ASCII.GetString($bytes, $p, $end - $p)
          }
          foreach ($n in @("uc_open", "uc_ctl")) {
            if ($names -notcontains $n) { throw "export $n missing (have $($names -join ', '))" }
          }
          echo "exports OK (${{ matrix.arch }}): $($names -join ', ')"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-dll-veh-off-${{ matrix.arch }}
          path: |
            ${{ steps.locate.outputs.dll }}
            PROVENANCE-${{ matrix.arch }}.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # engine-windows (amd64 runner): run golem's engine suite for real
  # against the freshly built VEH-off DLL.
  # ------------------------------------------------------------------
  engine-windows:
    needs: build-unicorn-dll
    runs-on: windows-2022
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download the VEH-off unicorn.dll
        uses: actions/download-artifact@v4
        with:
          name: unicorn-dll-veh-off-amd64
          path: unicorn-dll # unicorn-dll/unicorn.dll + PROVENANCE

      - name: Expose the absolute DLL path to the tests
        run: |
          $dll = (Get-ChildItem -Recurse -Filter unicorn.dll | Select-Object -First 1).FullName
          echo "GOLEM_UNICORN=$dll" >> $env:GITHUB_ENV
          echo "DLL: $dll"

      - name: Engine tests on Windows (fakebe contract + full suite)
        run: go test -tags unicorn ./... -v

      - name: Engine smoke — CLI on a real .so
        run: |
          go build -tags unicorn -o golem-cli.exe ./cmd/golem
          .\\golem-cli.exe examples\\native\\native.so add 2 3
          .\\golem-cli.exe examples\\native\\native.so fib 20

      - name: TCG buffer sizing curve (pool 10, PREALLOC = real committed memory)
        run: |
          go build -tags unicorn -o tcgsizing.exe ./cmd/tcgsizing
          # On Windows+PREALLOC each TCG byte is committed per instance, so
          # this measures the real deployment trade-off (memory vs throughput).
          .\tcgsizing.exe -so examples\native\native.so -assets assets `
            -pool 10 -iters 2000 -sizes 8,16,32,64,128,256,1024 |
            Tee-Object -FilePath tcg-sizing-report.txt

      - name: Upload TCG sizing report
        uses: actions/upload-artifact@v4
        with:
          name: tcg-sizing-report
          path: tcg-sizing-report.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # auto-commit: drop both DLLs + provenance into assets/windows/<arch>/
  # so consumers clone and run. [skip ci] prevents a trigger loop.
  # ------------------------------------------------------------------
  auto-commit:
    needs: [build-unicorn-dll, engine-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # commit back to the triggering branch

      - name: Download both DLLs
        uses: actions/download-artifact@v4
        with:
          pattern: unicorn-dll-veh-off-*
          path: artifacts

      - name: Stage into assets
        run: |
          mkdir -p assets/windows/amd64 assets/windows/arm64
          find artifacts -name unicorn.dll -path "*amd64*" -exec cp {} assets/windows/amd64/unicorn.dll \;
          find artifacts -name unicorn.dll -path "*arm64*" -exec cp {} assets/windows/arm64/unicorn.dll \;
          find artifacts -name "PROVENANCE-*.txt" -exec cp {} assets/windows/ \;
          ls -la assets/windows/amd64 assets/windows/arm64

      - name: Commit if changed
        run: |
          git config user.name "golem-ci"
          git config user.email "golem-ci@users.noreply.github.com"
          git add assets/windows/
          if git diff --cached --quiet; then
            echo "DLLs unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "[skip ci] assets: refresh unicorn.dll (${{ env.UNICORN_REF }}, VEH off, amd64+arm64)"
          git push
