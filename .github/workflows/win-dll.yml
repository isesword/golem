name: win-dll

# Windows engine path end to end:
#   1. build VEH-off unicorn DLLs from OUR fork — isesword/unicorn, branch
#      golem/win-veh-off (= unicorn dev 938efd1 + PR #2286 Windows ARM64
#      support) — with -DWIN32_ENABLE_VEH=OFF (PR #2364: VEH compiled out,
#      preallocation mandatory) for amd64 AND arm64;
#   2. publish them to GitHub Releases: dev-win pushes produce prereleases
#      (experimental endpoint), tags on main produce full releases;
#   3. THE REAL PRIZE — run golem's full engine test suite on Windows
#      runners against those DLLs: uc_open → UC_CTL_UC_PREALLOC → map →
#      hooks (incl. callbacks re-entering the backend) → emu_start. This
#      is the standing proof that the VEH/Go-runtime conflict is resolved
#      (ARCHITECTURE.md).

on:
  workflow_dispatch:
  push:
    branches: [dev-win]
    paths:
      - ".github/workflows/win-dll.yml"
      - "internal/emu/**"
      - "emulator/**"
      - "assets/windows/**"

env:
  GO_VERSION: "1.26"
  # Source = OUR fork's golem/win-veh-off branch: unicorn 938efd1 (dev) +
  # PR #2286 (Windows ARM64 support, musl setjmp/longjmp). The branch is
  # the version lock — bump it only by re-running the golem suite.
  # Fork exit condition: once unicorn-engine/unicorn merges PR #2286 and
  # ships a release that includes PR #2364 (WIN32_ENABLE_VEH=OFF), point
  # UNICORN_REPO back at upstream and pin UNICORN_REF to that release
  # tag/commit — then retire the fork branch.
  UNICORN_REPO: https://github.com/isesword/unicorn.git
  UNICORN_REF: golem/win-veh-off

jobs:
  build-unicorn-dll:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,      arch: amd64, cmake_arch: x64 }
          - { os: windows-2022,      arch: arm64, cmake_arch: ARM64 }
    # Matrix job outputs take the value from the leg that finishes last;
    # both legs resolve the same UNICORN_REF branch, so the SHA is identical.
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve unicorn ref to commit SHA
        id: ref
        run: |
          # Pin the cache key to the actual commit: caching under a mutable
          # branch name kept serving a stale unicorn-src after the branch
          # advanced (the exact bug that hid the arm64 fix for three runs).
          $line = git ls-remote ${{ env.UNICORN_REPO }} ${{ env.UNICORN_REF }}
          $sha = $line.Split("`t")[0]
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "unicorn commit: $sha"
      - name: Cache unicorn source
        id: cache
        uses: actions/cache@v4
        with:
          path: unicorn-src
          key: unicorn-src-${{ steps.ref.outputs.sha }}

      - name: Checkout unicorn at resolved commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone ${{ env.UNICORN_REPO }} unicorn-src
          git -C unicorn-src checkout ${{ steps.ref.outputs.sha }}

      - name: Configure (VEH compiled out)
        run: |
          # VS generator cross builds: unicorn's arch detection must see the
          # TARGET processor. -DCMAKE_SYSTEM_PROCESSOR sets it explicitly.
          cmake -S unicorn-src -B build `
            -A ${{ matrix.cmake_arch }} `
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }} `
            -DWIN32_ENABLE_VEH=OFF `
            -DUNICORN_ARCH="aarch64" `
            -DCMAKE_BUILD_TYPE=Release
          echo "=== configure result: MSVC_TARGET_ARCH / processor ==="
          Select-String -Path unicorn-src/CMakeLists.txt -Pattern "CMAKE_SYSTEM_PROCESSOR" | Select-Object -First 2
          if (Test-Path build/CMakeCache.txt) {
            Select-String -Path build/CMakeCache.txt -Pattern "CMAKE_SYSTEM_PROCESSOR|CMAKE_GENERATOR_PLATFORM" | ForEach-Object { $_.Line }
          }
      - name: Build unicorn.dll
        run: cmake --build build --config Release --parallel

      - name: Build provenance
        run: |
          $prov = @(
            "unicorn commit : $(git -C unicorn-src rev-parse HEAD) [golem/win-veh-off]",
            "target arch    : ${{ matrix.arch }}",
            "cmake          : -A ${{ matrix.cmake_arch }} -DWIN32_ENABLE_VEH=OFF -DUNICORN_ARCH=aarch64 -DCMAKE_BUILD_TYPE=Release",
            "built           : $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')"
          )
          $prov | Out-File -Encoding ascii PROVENANCE-${{ matrix.arch }}.txt
          cat PROVENANCE-${{ matrix.arch }}.txt

      - name: Locate + stage
        id: locate
        run: |
          # Stage FLAT: upload-artifact preserves the directory structure
          # below the common ancestor of the uploaded paths, so staging at
          # stage/<arch>/ would make the artifact contain
          # stage/<arch>/unicorn.dll and every consumer would have to know
          # the nesting. Each matrix leg has its own workspace, so a flat
          # stage/ is unambiguous and downloads land at unicorn-dll/unicorn.dll.
          # Locate the DLL in the BUILD TREE only — the checkout contains
          # committed assets/windows/*/unicorn.dll copies and a repo-wide
          # recursive search could pick one of those (stale AND possibly
          # the wrong arch) instead of the artifact this job just built.
          $dll = Get-ChildItem -Recurse -Filter unicorn.dll -Path build |
                 Select-Object -First 1
          if (-not $dll) { throw "no unicorn.dll found under build/" }
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item $dll.FullName "stage/unicorn.dll"
          Copy-Item "PROVENANCE-${{ matrix.arch }}.txt" "stage/"
          echo "dll=stage/unicorn.dll" >> $env:GITHUB_OUTPUT

      - name: Smoke — the DLL must export uc_open and uc_ctl
        run: |
          $dll = "${{ steps.locate.outputs.dll }}"
          # Parse the PE export table with .NET — no dumpbin (MSVC optional
          # component, not on the runner PATH) needed.
          $bytes = [IO.File]::ReadAllBytes($dll)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $optOff = $peOff + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optOff)
          if ($magic -eq 0x20B) { $dataDirOff = $optOff + 112 } else { $dataDirOff = $optOff + 96 }
          $expRva = [BitConverter]::ToUInt32($bytes, $dataDirOff)
          if ($expRva -eq 0) { throw "DLL has no export table" }
          $numSec = [BitConverter]::ToUInt16($bytes, $peOff + 6)
          $secOff = $optOff + [BitConverter]::ToUInt16($bytes, $peOff + 20)
          function RvaToOff($rva) {
            for ($i = 0; $i -lt $numSec; $i++) {
              $s = $secOff + $i * 40
              $va = [BitConverter]::ToUInt32($bytes, $s + 12)
              $sz = [BitConverter]::ToUInt32($bytes, $s + 8)
              $raw = [BitConverter]::ToUInt32($bytes, $s + 20)
              if ($rva -ge $va -and $rva -lt $va + $sz) { return $raw + ($rva - $va) }
            }
            throw "RVA $rva not in any section"
          }
          $namesRva = [BitConverter]::ToUInt32($bytes, (RvaToOff $expRva) + 32)
          $namesCnt = [BitConverter]::ToUInt32($bytes, (RvaToOff $expRva) + 24)
          $names = @()
          for ($i = 0; $i -lt $namesCnt; $i++) {
            $p = RvaToOff ([BitConverter]::ToUInt32($bytes, (RvaToOff $namesRva) + $i * 4))
            $end = $p; while ($bytes[$end] -ne 0) { $end++ }
            $names += [Text.Encoding]::ASCII.GetString($bytes, $p, $end - $p)
          }
          foreach ($n in @("uc_open", "uc_ctl")) {
            if ($names -notcontains $n) { throw "export $n missing (have $($names -join ', '))" }
          }
          echo "exports OK (${{ matrix.arch }}): $($names -join ', ')"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-dll-veh-off-${{ matrix.arch }}
          # Both files sit in stage/, so the artifact is flat:
          # unicorn-dll/unicorn.dll + unicorn-dll/PROVENANCE-<arch>.txt.
          path: |
            stage/unicorn.dll
            stage/PROVENANCE-${{ matrix.arch }}.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # engine-windows (amd64 runner): run golem's engine suite for real
  # against the freshly built VEH-off DLL.
  # ------------------------------------------------------------------
  engine-windows:
    needs: build-unicorn-dll
    runs-on: windows-2022
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download the VEH-off unicorn.dll
        uses: actions/download-artifact@v4
        with:
          name: unicorn-dll-veh-off-amd64
          path: unicorn-dll # unicorn-dll/unicorn.dll + PROVENANCE

      - name: Expose the absolute DLL path to the tests
        run: |
          # Pin the exact artifact path — do NOT search recursively: the
          # checkout already contains committed assets/windows/*/unicorn.dll
          # and a recursive -First 1 pick grabbed the amd64 asset on the
          # arm64 runner (LoadLibrary then fails with a misleading
          # "module could not be found").
          $dll = (Resolve-Path "unicorn-dll\unicorn.dll").Path
          echo "GOLEM_UNICORN=$dll" >> $env:GITHUB_ENV
          echo "DLL: $dll"

      - name: Engine tests on Windows (fakebe contract + full suite)
        run: go test -tags unicorn ./... -v

      - name: Engine smoke — CLI on a real .so
        run: |
          go build -tags unicorn -o golem-cli.exe ./cmd/golem
          .\\golem-cli.exe examples\\native\\native.so add 2 3
          .\\golem-cli.exe examples\\native\\native.so fib 20

      - name: TCG buffer sizing curve (pool 10, PREALLOC = real committed memory)
        run: |
          go build -tags unicorn -o tcgsizing.exe ./cmd/tcgsizing
          # On Windows+PREALLOC each TCG byte is committed per instance, so
          # this measures the real deployment trade-off (memory vs throughput).
          .\tcgsizing.exe -so examples\native\native.so -assets assets `
            -pool 10 -iters 2000 -sizes 8,16,32,64,128,256,1024 |
            Tee-Object -FilePath tcg-sizing-report.txt

      - name: Upload TCG sizing report
        uses: actions/upload-artifact@v4
        with:
          name: tcg-sizing-report
          path: tcg-sizing-report.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # engine-windows-arm64 (windows-11-arm runner): the arm64 DLL is only
  # cross-COMPILED on amd64 — its whole point is PR #2286's runtime
  # correctness (musl setjmp/longjmp instead of the CRT's always-unwind
  # longjmp), which a compile check cannot prove. Run the engine suite +
  # CLI smoke natively on WoA. This gates the release publish: an arm64 DLL that
  # never ran is not worth committing.
  # ------------------------------------------------------------------
  engine-windows-arm64:
    needs: build-unicorn-dll
    runs-on: windows-11-arm
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download the VEH-off arm64 unicorn.dll
        uses: actions/download-artifact@v4
        with:
          name: unicorn-dll-veh-off-arm64
          path: unicorn-dll # unicorn-dll/unicorn.dll + PROVENANCE

      - name: Expose the absolute DLL path to the tests
        run: |
          # Pin the exact artifact path — see the amd64 job for why a
          # recursive search is wrong here (it picks up the committed
          # assets/windows/*/unicorn.dll, possibly the wrong arch).
          $dll = (Resolve-Path "unicorn-dll\unicorn.dll").Path
          echo "GOLEM_UNICORN=$dll" >> $env:GITHUB_ENV
          echo "DLL: $dll"
          # Fail loudly on an arch mismatch instead of dying inside
          # LoadLibrary: PE header machine field (0xAA64 = ARM64).
          $bytes = [IO.File]::ReadAllBytes($dll)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($machine -ne 0xAA64) { throw "unicorn.dll machine = 0x{0:X4}, expected 0xAA64 (ARM64)" -f $machine }

      - name: Engine tests on Windows ARM64 (fakebe contract + full suite)
        run: go test -tags unicorn ./... -v

      - name: Engine smoke — CLI on a real .so
        run: |
          go build -tags unicorn -o golem-cli.exe ./cmd/golem
          .\golem-cli.exe examples\native\native.so add 2 3
          .\golem-cli.exe examples\native\native.so fib 20

  # ------------------------------------------------------------------
  # release: publish both DLLs + provenance to a GitHub Release.
  #   dev-win push  -> prerelease, tag v<version>-dev.<run_number>
  #   main tag push -> full release (latest)
  # Notes are auto-generated from merged PR titles (squash-merge policy).
  # ------------------------------------------------------------------
  release:
    needs: [build-unicorn-dll, engine-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all DLL artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unicorn-dll-veh-off-*
          path: artifacts

      - name: Determine release version and flags
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "version=v0.1.0-dev.$(date -u +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: golem ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/**/unicorn.dll
            artifacts/**/PROVENANCE-*.txt
      - name: Upload TCG sizing report
        uses: actions/upload-artifact@v4
        with:
          name: tcg-sizing-report
          path: tcg-sizing-report.txt
          if-no-files-found: ignore
