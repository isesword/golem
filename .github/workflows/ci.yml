name: CI

# golem — pure-Go multi-platform native library emulation framework.
#
# Matrix intent:
#   - linux (amd64 + arm64): FULL verification — pure-Go layer, Unicorn engine
#     (apt libunicorn), race detector, and the in-repo end-to-end suite
#     (examples/native exercises ELF load/link/JNI/syscalls for real).
#   - windows / macOS: compile + pure-Go tests only. The engine binds libunicorn
#     via purego at runtime; Windows needs no compile-time artifact but the
#     engine does not RUN there (unicorn's VEH lazy page commit fights the Go
#     runtime's exception handler — documented in BUILD.md). macOS compiles and
#     runs the pure-Go layer; a local `brew install unicorn` enables the engine.
#
# The real-network e2e suite is NOT run here: it needs fresh session
# credentials and hits a production gateway. Everything else is covered.

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  # ------------------------------------------------------------------
  # Pure-Go layer — every platform, no engine needed.
  # ------------------------------------------------------------------
  pure-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: "Test (pure-Go layer: linker vs bundled bionic, allocator, dvm)"
        run: CGO_ENABLED=0 go test ./...

  # ------------------------------------------------------------------
  # Linux engine matrix — the full verification platform.
  # amd64 + arm64 (arm64 runs on GitHub's native arm runners).
  # ------------------------------------------------------------------
  engine-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install libunicorn 2.x (runtime-loaded via purego, no cgo)
        run: sudo apt-get update && sudo apt-get install -y libunicorn-dev
      - name: Engine build (CGO_ENABLED=0 — the whole point)
        run: CGO_ENABLED=0 go build -tags unicorn ./...
      - name: Engine vet
        run: CGO_ENABLED=0 go vet -tags unicorn ./...
      - name: Engine tests
        run: CGO_ENABLED=0 go test -tags unicorn ./...
      - name: Race detector (dvm + emulator, the concurrency-critical packages)
        run: go test -race ./dvm/ ./emulator/ ./internal/memory/

  # ------------------------------------------------------------------
  # End-to-end on Linux: boot a real engine, load real bionic + a real
  # .so, run JNI_OnLoad, call exports, handle syscalls — CLI smoke plus
  # the full engine integration suite (JNI probe incl. the reference
  # slots, syscalls, inline hooks, debugger).
  # ------------------------------------------------------------------
  e2e-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install libunicorn 2.x
        run: sudo apt-get update && sudo apt-get install -y libunicorn-dev
      - name: CLI smoke — load native.so, call add(2,3) and fib(20) on the engine
        run: |
          CGO_ENABLED=0 go build -tags unicorn -o /tmp/golem-cli ./cmd/golem
          /tmp/golem-cli examples/native/native.so add 2 3
          /tmp/golem-cli examples/native/native.so fib 20
      - name: E2E — engine integration suite
        run: CGO_ENABLED=0 go test -tags unicorn ./emulator/ -v

  # ------------------------------------------------------------------
  # Compile matrix: prove the framework consumes cleanly as a library
  # on all three OSes × the relevant architectures with the engine tag
  # (the TrainApp integration shape). Windows must COMPILE; it is not
  # expected to run the engine (VEH conflict, see BUILD.md).
  # ------------------------------------------------------------------
  consumer-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }} (-tags unicorn)
        run: go build -tags unicorn ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
